<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8fafc">
  <meta name="description" content="A lightweight, browser-based dinosaur runner with a persistent high score.">
  <title>T-R-E-X | Dino Runner</title>
  <link rel="stylesheet" href="style.css">
  <script src="p5.js"></script>
  <script src="p5.dom.min.js"></script>
  <script src="p5.sound.min.js"></script>
  <script src="p5.play.js"></script>
</head>
<body>
  <main class="shell">
    <div class="eyebrow">THE OFFLINE CLASSIC · REMIXED</div>
    <h1>T-R-E-X<span>.</span></h1>
    <p class="subtitle">Run. Jump. Beat your best.</p>
    <div id="game" class="game-frame" aria-label="Dinosaur runner game"></div>
    <p class="hint">Space / ↑ to jump · R to restart · Tap on mobile</p>
    <p class="footnote">High score is saved only in your browser.</p>
  </main>
  <script src="gameplay.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
