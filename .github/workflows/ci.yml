name: Test T-R-E-X
on: [push, pull_request]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check sketch.js
      - run: test -s index.html && test -s trex1.png && test -s p5.play.js
